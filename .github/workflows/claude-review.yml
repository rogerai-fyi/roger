name: claude-review
# A second, cloud-side review on every PR, in addition to the local pre-push audit.
# Inert until the repository secret CLAUDE_CODE_OAUTH_TOKEN exists (create it with
# `claude setup-token`; it bills the Claude subscription's remote credits). It never runs
# for a PR from a fork: this repo is public and a fork PR must not reach the secret.
# Uses GITHUB_TOKEN, so the Claude GitHub App is not required.
# Advisory by design - it comments, it is not a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Skip when no token is configured
        if: env.CLAUDE_TOKEN == ''
        run: echo "CLAUDE_CODE_OAUTH_TOKEN is not set - claude-review is inert."
      - uses: actions/checkout@v4
        if: env.CLAUDE_TOKEN != ''
        with:
          fetch-depth: 0
      # Pinned to a commit: this step holds a subscription token in a public repo.
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1
        if: env.CLAUDE_TOKEN != ''
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The built-in token (not the Claude GitHub App): reviews post as the Actions bot.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}: the diff is
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`. Act as an adversarial senior
            reviewer. Report only real problems, each with file:line and a concrete fix:
            1. Correctness bugs and regressions, especially auth/session identity (a session
               must never reach another provider's account through a login-string collision),
               money/ledger/payout paths, moderation, audit, and multi-instance state.
            2. Security: injection, authz gaps, secrets, unsafe redirects, CSRF.
            3. Missing or weakened tests: the project is spec-first (Gherkin features under
               features/, table tests with testify, no mocks on money paths). Flag any
               behavior change without a test that would fail without it.
            4. Production code that need not exist (duplicates a helper, dead code).
            Do not comment on style. If you find nothing, say so in one line.
          claude_args: |
            --max-turns 12
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
