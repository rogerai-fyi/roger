name: artifact-drift
# Every artifact the built site ADVERTISES must be fetchable by a stranger.
#
# v5.4.8 shipped a "WAVE MICRO v1.0 - AVAILABLE" headline, a download control and
# schema.org metadata all pointing at a 401, with the whole web suite green - a
# release claim is a NETWORK fact about a third-party host, and no offline test can
# see it.
#
# Separate from edge-drift on purpose. This needs a WIDE trigger (any page can start
# advertising an artifact), while the header/redirect drift check needs a narrow one
# and is currently red on an unrelated pending certificate. Sharing a workflow would
# have made every web change report that failure.
on:
  push:
    branches: [main]
    paths:
      - web/src/**
      - web/scripts/verify-artifacts.mjs
  schedule:
    - cron: '41 9 * * 1' # weekly - catches an artifact that goes private LATER
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    # push/schedule ONLY. This checks the LIVE site, so on a pull_request it would
    # assert against production as it exists BEFORE the change merges - a page that
    # first ships in the PR is guaranteed 404, and the gate would block the very
    # change that satisfies it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: advertised artifacts are publicly reachable
        run: node web/scripts/verify-artifacts.mjs
