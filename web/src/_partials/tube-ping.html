<!-- The WEB mascot: high-fidelity vector Ping.
     The website, the iOS app and macOS all render the VECTOR mascot. The ASCII
     Tube Ping in internal/tui/tube_ping.go is the TERMINAL form of the same
     character and must not leak onto a surface that can draw curves - a browser
     showing monospace block glyphs is the terminal costume worn in the wrong
     place. Keep each in its own medium.
     The viewBox starts above y=0, not 0: the signal arcs peak above the antennae and an
     outermost SVG clips to its viewBox, so at 0 the top of the outer arc's stroke was
     being shaved off. The extra band is headroom for the signal, nothing is drawn in it.
     Geometry is mascot.svg, inlined so it inherits currentColor for light/dark
     and so no extra request is needed. Its ids are CLASSES here because index.html
     includes this partial twice and duplicate ids are invalid; the animations live
     in base.css (.tube-ping__mark) rather than a repeated inline <style>. -->
<figure class="tube-ping" role="img" aria-label="Ping, the RogerAI on-air mascot">
  <svg class="tube-ping__mark" viewBox="0 -8 64 80" fill="currentColor" aria-hidden="true" focusable="false">
    <g class="ping-mark">
      <!-- Signal arcs radiating from the ANTENNAE, not from the eye. They were briefly
           tied to the beacon, which put their apex at y=7 against a bracket top of y=8 -
           drawn on the head rather than above it. They now clear the brackets and pivot on
           the antenna line so they scale away from the source. -->
      <g fill="none" stroke="#E0231C" stroke-linecap="round" stroke-width="2">
        <path class="ping-mark__wave ping-mark__wave--a" d="M16 8 A18 18 0 0 1 48 8" opacity="0"/>
        <path class="ping-mark__wave ping-mark__wave--b" d="M11 10 A24 24 0 0 1 53 10" opacity="0"/>
      </g>
      <g class="ping-mark__body">
        <!-- bracket arms/antennae, mirroring logo.svg -->
        <path d="M10 8 h9 v4.5 H14.5 v9 H19 V26 H10 Z"/>
        <path d="M54 8 h-9 v4.5 H49.5 v9 H45 V26 h9 Z"/>
        <!-- body block with shoulders -->
        <path d="M22 30 h20 v18 a4 4 0 0 1 -4 4 h-12 a4 4 0 0 1 -4 -4 Z"/>
        <!-- feet -->
        <rect x="25" y="64" width="5" height="5" rx="1"/>
        <rect x="34" y="64" width="5" height="5" rx="1"/>
      </g>
      <!-- the on-air eye IS the brand beacon: the same live-red circle that sits
           between the brackets of the logo, favicon and nav mark. -->
      <circle class="ping-mark__glow" cx="32" cy="17" r="9" fill="#E0231C" opacity="0.3"/>
      <circle class="ping-mark__eye" cx="32" cy="17" r="5" fill="#E0231C"/>
    </g>
  </svg>
  <figcaption><b>PING</b><span>RogerAI Labs · right-sized intelligence</span></figcaption>
</figure>
