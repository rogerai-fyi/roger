<!-- The adapter dial (features/web/sensor_positioning.feature). Every name, stage and line
     is a cap token from src/data/capabilities.json, so the homepage and the industrial
     page read one file; test/capabilities.test.mjs holds every lamp to it. The component
     is .spectrum--dial in components.css. -->
<ol class="spectrum spectrum--dial" data-scrub aria-label="Adapters and skills, with their status">
  <li data-cap="fire-warning" data-cap-stage="{{cap:fire-warning.stage}}"><i class="cap-lamp" aria-hidden="true"></i><span><b>{{cap:fire-warning.name}}</b><span class="cap-stage">{{cap:fire-warning.label}}</span>{{cap:fire-warning.description}}</span></li>
  <li data-cap="telemetry-drift" data-cap-stage="{{cap:telemetry-drift.stage}}"><i class="cap-lamp" aria-hidden="true"></i><span><b>{{cap:telemetry-drift.name}}</b><span class="cap-stage">{{cap:telemetry-drift.label}}</span>{{cap:telemetry-drift.description}}</span></li>
  <li data-cap="custom" data-cap-stage="{{cap:custom.stage}}"><i class="cap-lamp" aria-hidden="true"></i><span><b>{{cap:custom.name}}</b><span class="cap-stage">{{cap:custom.label}}</span>{{cap:custom.description}}</span></li>
</ol>
