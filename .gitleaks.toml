# gitleaks config for RogerAI.
#
# We extend gitleaks' default ruleset and allowlist a small set of AUDITED false positives.
# A full-history scan (`gitleaks detect --log-opts=--all`) surfaced ONLY these, and each was
# verified to be a non-secret: a test fixture, the PUBLIC GitHub OAuth client id, a doc curl
# placeholder, an env-var line, or a generated artifact. No real credential is committed -
# all real secrets are env-sourced (GITHUB_OAUTH_CLIENT_SECRET, STRIPE_SECRET_KEY,
# BROKER_PRIVATE_KEY, RESEND_API_KEY) and .env.example ships them empty.
#
# RULE: re-audit any NEW finding before adding it here. This file must never be used to
# hide a real secret - rotate + purge those instead.

title = "RogerAI gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Audited false positives (see header). Verified: no real secret committed."

# Specific non-secret strings the default rules flag. Matched against the detected secret.
# We DELIBERATELY allowlist by exact value, NOT by path: a broad path allowlist (e.g. the
# generated coverage/ report or web/dist/ build output) could mask a real secret bundled
# into generated output, so every suppression here is a precise, audited string.
regexes = [
  # --- Audited 2026-10-11 (all on unmerged feature branches; each verified a non-secret) ---
  # Edge root-proof GOLDEN VECTORS (internal/edgeauth/testdata/root_proof_vectors.json): keys
  # derived from published one-time test codes by an independent Python reference; test data.
  '''b6f3e4472e65660b01bbc93eeb85a1b606fe90ce21c3a054d76e2d944a1dfafd''',
  '''53b58aa2e060c61a0fec8de497259a79ddc4202a3fc8d34649c0c2a9fb7fd723''',
  '''50817702c74e01aad884a60683f7be2fec11005ef338e76013ab69a802609f61''',
  '''061877fecb0509cbe4fc3dcbeb9cc1ea592dc41462543b5a7681a498574bc53b''',
  # Fake key in a fake HTTP response (cmd/rogerai/keys_test.go).
  '''rog-key_s3cret''',
  # GGUF metadata field NAME, not a value (internal/detect/ggufshape_test.go).
  '''qwen3\.vocab_size''',
  # Environment variable NAME with an empty value (cmd/rogerai/routing_flags_bdd_test.go).
  '''ROGERAI_CONSUMER_DEFAULT_MAX_PRICE_OUT=''',
  # Redaction test input (internal/edge/logtail_test.go): the test asserts it gets redacted.
  '''abc123def456''',
  # PUBLIC GitHub OAuth client id - public by design (see cmd/rogerai/main.go defaultGitHubClientID).
  '''Ov23liQE7Z6ITMbeJoF3''',
  # Historical fake Stripe test fixture (the current code uses sk_live_not_a_real_key, which
  # does not match the stripe rule); kept so the history scan stays clean.
  '''sk_live_realprodkey''',
  '''sk_live_not_a_real_key''',
  # TUI keybinding help string ("keys: pgup/pgdown/ctrl+u/ctrl+d"), not an API key.
  '''pgup/pgdown/ctrl\+u/ctrl\+d''',
  # An env-var line mis-flagged as KEY=value after an empty TOKENIZER_URL= in .env.example.
  '''ROGERAI_RECOUNT_TOLERANCE=0\.02''',
  # Docs: the non-secret local proxy key default printed by `roger use`.
  '''roger-local''',
  # Docs: a historical placeholder example bearer token in the manual.
  '''sk-roger-\.\.\.''',
  # AUDITED 2026-08-29. Test fixture in internal/stationattach/stationattach_test.go
  # (b76818c52e, since deleted): `const inviteSecret = "test-invite-secret"`, documented in
  # the file as "the plaintext an operator would hand a Station", used so the secret check
  # is exercised on every path rather than bypassed. Not a credential - it never existed
  # outside the test.
  '''test-invite-secret''',
  # AUDITED 2026-08-29. NOT a secret at all: a URL PATH in
  # internal/edgeclient/edgeclient_test.go (9ee8fe7684),
  # `w.client.Do(ctx, auth, "v1/no/leading/slash", ...)` - a test asserting the client
  # accepts a path with no leading slash. The generic-api-key rule fires on a string
  # literal following a variable named `auth`. Nothing to rotate; the shape will recur,
  # so tighten the rule rather than grow this list if it does.
  '''v1/no/leading/slash''',
  # AUDITED 2026-10-04. NOT a secret: an environment-variable NAME followed by "=" in the
  # routing CLI test (cmd/rogerai/routing_flags_bdd_test.go, 825045af). The test builds a
  # child-process env list of `"NAME="+value` entries right after a test-generated admin-key
  # variable, and generic-api-key captures the NAME= text as the "secret" (same shape as
  # ROGERAI_RECOUNT_TOLERANCE above). Real values are generated at test time, never committed.
  '''ROGERAI_CONSUMER_DEFAULT_MAX_PRICE_OUT=''',
]
