  # GGUF metadata field NAME, not a value (internal/detect/ggufshape_test.go).
  '''^qwen3\.vocab_size$''',
  # Environment variable NAME with an empty value (cmd/rogerai/routing_flags_bdd_test.go, audited
  # 2026-10-04): generic-api-key captures the NAME= text after a test-generated admin-key variable.
  '''^ROGERAI_CONSUMER_DEFAULT_MAX_PRICE_OUT=$''',
