  # is exercised on every path rather than bypassed. Not a credential - it never existed
  # outside the test.
  '''^test-invite-secret-0123456789$''',
  # AUDITED 2026-08-29. NOT a secret at all: a URL PATH in
  # internal/edgeclient/edgeclient_test.go (9ee8fe7684),
  # `w.client.Do(ctx, auth, "v1/no/leading/slash", ...)` - a test asserting the client
  # accepts a path with no leading slash. The generic-api-key rule fires on a string
  # literal following a variable named `auth`. Nothing to rotate; the shape will recur,
  # so tighten the rule rather than grow this list if it does.
  '''^v1/no/leading/slash$''',
